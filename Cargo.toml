[package]
name = "clip-sync"
version = "0.1.0"
edition = "2021"
description = "Align two videos by comparing audio fingerprints"
license = "Non-commercial"

[features]
default = []
he-aac = ["dep:fdk-aac", "dep:symphonia-core"]
ffmpeg-tests = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusty-chromaprint = "0.3"
rubato = "0.16"
cross_correlate = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["default", "isomp4", "aac"] }
fdk-aac = { version = "0.8", optional = true }
symphonia-core = { version = "0.6", optional = true }
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
hound = "3"
tempfile = "3"
