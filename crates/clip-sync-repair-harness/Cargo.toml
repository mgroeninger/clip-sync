[package]
name = "clip-sync-repair-harness"
version.workspace = true
edition = "2021"
publish = false
description = "Shared integration/validation runners for clip-sync-repair tier binaries"

[lib]
name = "clip_sync_repair_harness"
path = "src/lib.rs"

# Cross-corpus gap-fingerprint prevalence/mechanism stats over `--gap-fingerprints` output dirs.
# Gated behind `calibration` so this workspace member's bin stays out of default `cargo build`.
[[bin]]
name = "gap-fingerprint-stats"
path = "src/bin/gap_fingerprint_stats.rs"
required-features = ["calibration"]

[features]
# Enables the gap-fingerprint calibration tooling (the `gap-fingerprint-stats` bin). Mirrors the
# `calibration` feature on `clip-sync-repair`.
calibration = []

[dependencies]
clip-sync-repair = { path = "../clip-sync-repair" }
clip-sync-repair-fixtures = { path = "../clip-sync-repair-fixtures" }
clip-sync = { path = "../clip-sync", features = ["test-utils"] }
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
