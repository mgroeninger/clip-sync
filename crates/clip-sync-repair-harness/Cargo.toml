[package]
name = "clip-sync-repair-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared integration/validation runners for clip-sync-repair tier binaries"

[lib]
name = "clip_sync_repair_harness"
path = "src/lib.rs"

[dependencies]
clip-sync-repair = { path = "../clip-sync-repair" }
clip-sync = { path = "../clip-sync", features = ["test-utils"] }
hound = "3"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.8"
