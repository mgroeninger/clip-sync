# ── punch-after-encode dead-zone probe (G5 confirmation) ───────────────────────
# Same finale anchor as the inject-then-encode transient cases, but A is encoded from the FULL master,
# decoded, then the gap is punched in PCM — so A's borders are NATIVE (no inject-then-encode MDCT ring)
# and the gap interior is clean (default peak cap, no relaxation). Removes the NaN-floor confound: this
# is the decisive test of whether a real INDEPENDENT-encode floor can be informative at a dead-Pearson
# seam. `_dual` (128k/192k) is the production-realistic independent encode; `_same` is the comparison.
[[case]]
id = "cc_music_punch_finale_aac_dual"
source_id = "musopen_grieg_mountain_king"
oracle_variant = "same_master"
format_a = "mp4_aac"
format_b = "mp4_aac"
bitrate_a = "128k"
bitrate_b = "192k"
total_secs = 153
gap_anchor_secs = 148.5
punch_after_encode = true

[[case]]
id = "cc_music_punch_finale_aac_same"
source_id = "musopen_grieg_mountain_king"
oracle_variant = "same_master"
format_a = "mp4_aac"
format_b = "mp4_aac"
bitrate_a = "128k"
bitrate_b = "128k"
total_secs = 153
gap_anchor_secs = 148.5
punch_after_encode = true

