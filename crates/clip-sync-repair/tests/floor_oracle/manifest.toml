version = 1

# FLOOR_OK calibration oracle (real Wikimedia masters → injected gap → encode).
# Sources: tests/corpus/sources.toml + scripts/fetch_corpus_sources.ps1
# Run: cargo test -p clip-sync-repair source_gap_oracle_floor_csv -- --ignored --nocapture
#
# Codecs calibrated are only those the production pipeline can DECODE (Symphonia): AAC, Vorbis, WAV.
# Opus is excluded — Symphonia has no Opus codec, so Opus is not a real input format.
# MP3 contributes zero calibration confidence (M4): inject-then-encode oracle rows are skip-artifacts
# or libmp3lame determinism-artifacts, not FLOOR_OK data — see docs/residual-gate-findings.md M4.
# All MP3 cases except `cc_speech_gap_oracle_mp3_same` are `ignore = true`; that one row is kept as
# documented Pearson-skip evidence for M4, not a calibration datum.
#
# `expect_informative_floor` for lossy same-master cases is the calibration OUTPUT: values marked
# PROVISIONAL are best guesses pending the first run; a mismatch panics with the measured floor
# (pre/post dB), which is exactly the datum to record — flip the expectation to match.

[defaults]
total_secs = 60
sample_rate = 48000
gap_duration_secs = 1.0
gap_signature_context_secs = 3.0
bitrate = "128k"
duration_match_tolerance_secs = 0.05
gap_interior_edge_secs = 0.05
gap_interior_peak_max = 500

# ── speech ───────────────────────────────────────────────────────────────────
[[case]]
id = "cc_speech_gap_oracle_wav"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "wav"
format_b = "wav"
expect_informative_floor = true

[[case]]
id = "cc_speech_gap_oracle_aac_same"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "mp4_aac"
format_b = "mp4_aac"
bitrate_a = "128k"
bitrate_b = "128k"
expect_informative_floor = true

[[case]]
id = "cc_speech_gap_oracle_aac_dual"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "mp4_aac"
format_b = "mp4_aac"
bitrate_a = "128k"
bitrate_b = "192k"
expect_informative_floor = true

[[case]]
id = "cc_speech_gap_oracle_aac_64k"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "mp4_aac"
format_b = "mp4_aac"
bitrate_a = "64k"
bitrate_b = "64k"
# Calibrated: post-side floor exceeds FLOOR_OK (-15) at 64k → gate abstains (safe).
expect_informative_floor = false

[[case]]
id = "cc_speech_gap_oracle_mp3_same"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "mp3"
format_b = "mp3"
bitrate_a = "128k"
bitrate_b = "128k"
# M4 canonical row — NOT calibration: speech MP3 128k skips at Pearson gate on inject-then-encode
# oracle (post ≈ −0.056 < −0.05; structure_ok). Kept in CSV run as documented skip evidence.
# Production MP3 is unvalidated; see docs/residual-gate-findings.md M4.
expect_informative_floor = false

[[case]]
id = "cc_speech_gap_oracle_mp3_dual"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "mp3"
format_b = "mp3"
bitrate_a = "128k"
bitrate_b = "64k"
ignore = true
# M4 — MP3 contributes no FLOOR_OK datum (skip-artifact or determinism-artifact).

[[case]]
id = "cc_speech_gap_oracle_mp3_64k"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "mp3"
format_b = "mp3"
bitrate_a = "64k"
bitrate_b = "64k"
ignore = true
# M4 — libmp3lame same-bitrate determinism (bit-identical borders → −120 dB), not codec noise.

[[case]]
id = "cc_speech_gap_oracle_vorbis_128k"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "vorbis"
format_b = "vorbis"
bitrate_a = "128k"
bitrate_b = "128k"
# PROVISIONAL — Ogg/Vorbis decodes natively (Symphonia); first Vorbis calibration point.
expect_informative_floor = true

[[case]]
id = "cc_speech_gap_oracle_vorbis_64k"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "vorbis"
format_b = "vorbis"
bitrate_a = "64k"
bitrate_b = "64k"
# Calibrated: informative (deterministic libvorbis → bit-identical borders, floor -120).
# Search may slide ~12 ms off truth (> residual_lag); gate abstains beyond reach (M5 fixed).
expect_informative_floor = true

