source_id = "musopen_grieg_mountain_king"
oracle_variant = "same_master"
format_a = "wav"
format_b = "wav"
expect_informative_floor = true

[[case]]
id = "cc_music_gap_oracle_aac_128k"
source_id = "musopen_grieg_mountain_king"
