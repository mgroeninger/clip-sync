version = 1

# FLOOR_OK calibration oracle (real Wikimedia masters → injected gap → encode).
# Sources: tests/corpus/sources.toml + scripts/fetch_corpus_sources.ps1
# Run: cargo test -p clip-sync-repair source_gap_oracle_floor_csv -- --ignored --nocapture

[defaults]
total_secs = 60
sample_rate = 48000
gap_duration_secs = 1.0
gap_signature_context_secs = 3.0
aac_bitrate = "128k"
duration_match_tolerance_secs = 0.05
gap_interior_edge_secs = 0.05
gap_interior_peak_max = 500

[[case]]
id = "cc_speech_gap_oracle_wav"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "wav"
format_b = "wav"
expect_informative_floor = true

[[case]]
id = "cc_speech_gap_oracle_aac_same"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "mp4_aac"
format_b = "mp4_aac"
aac_bitrate_a = "128k"
aac_bitrate_b = "128k"
expect_informative_floor = true

[[case]]
id = "cc_speech_gap_oracle_aac_dual"
source_id = "wikimedia_martin_amis_interview_1990"
oracle_variant = "same_master"
format_a = "mp4_aac"
format_b = "mp4_aac"
aac_bitrate_a = "128k"
aac_bitrate_b = "192k"
expect_informative_floor = true

[[case]]
id = "cc_ambient_gap_oracle_wav"
source_id = "wikimedia_schiphol_restaurant_ambience"
oracle_variant = "same_master"
format_a = "wav"
format_b = "wav"
expect_informative_floor = true

[[case]]
id = "cc_ambient_gap_oracle_aac_same"
source_id = "wikimedia_schiphol_restaurant_ambience"
oracle_variant = "same_master"
format_a = "mp4_aac"
format_b = "mp4_aac"
aac_bitrate_a = "128k"
aac_bitrate_b = "128k"
expect_informative_floor = true

[[case]]
id = "cc_ambient_gap_oracle_aac_dual"
source_id = "wikimedia_schiphol_restaurant_ambience"
oracle_variant = "same_master"
format_a = "mp4_aac"
format_b = "mp4_aac"
aac_bitrate_a = "128k"
aac_bitrate_b = "192k"
expect_informative_floor = true

[[case]]
id = "cc_speech_ambient_two_mic"
source_id = "wikimedia_martin_amis_interview_1990"
donor_source_id = "wikimedia_schiphol_restaurant_ambience"
oracle_variant = "two_mic"
format_a = "mp4_aac"
format_b = "mp4_aac"
aac_bitrate_a = "128k"
aac_bitrate_b = "128k"
expect_informative_floor = false
