# Residual gate validation catalog — implemented instances only.
#
# Scope:
#   - Rows here = tests that exist today (inventory + metadata).
#   - README backlog = planned tests not yet implemented.
#   - Not every row will move under tests/residual_gate_integration.rs — see README § Implementation.
#
# Fields:
#   id, layer, placement, config_profile, tier, assertion, location, fixture_ref, proves, claims
#
# config_profile: calibration | production_fit | production_like_synthetic
# tier: fast | ignored | diagnostic
# assertion: hard_assert | diagnostic_csv | floor_calibration
#
# claims: which validity-contract clause(s) the row serves
#   (see README § "What this suite must establish"):
#     C1 veto_fires            — veto rejects echo/decoy Pearson would accept
#     C2 abstain_out_of_regime — two-mic / diff-capture → uninformative → no opinion
#     C3 no_false_veto_truth   — correct same-master fill never vetoed
#     C4 off_no_regression     — residual_gate = off is a true no-op
#     C5 rescue_real_value     — does veto_rescue recover real gaps?   (resolved: no)
#     support                  — calibrates inputs a claim depends on (e.g. FLOOR_OK), not a claim itself

version = 1

# --- Layer B (score harness) — stays in seam_residual_corpus.rs ---

[[instance]]
id = "disagreement_oracles"
layer = "B"
placement = "P0"
config_profile = "production_fit"
tier = "fast"
assertion = "hard_assert"
location = "tests/seam_residual_corpus.rs::seam_residual_disagreement_oracles"
fixture_ref = ["f4_decoy", "f1_truth", "broadband_codec_noise"]
proves = "F4 veto; H2-B rescue at truth (score-level)"
claims = ["C1", "C5"]  # score-level only (layer B); not pipeline proof

