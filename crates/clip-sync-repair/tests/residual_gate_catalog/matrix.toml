# Claim coverage (see README § "What this suite must establish"):
#   C1 veto_fires            — score-level only (disagreement_oracles). Pipeline decoy veto = GAP
#                              (only out-of-matrix f4_decoy_residual_gate_vetoes_bool, calibration).
#                              No production_fit pipeline test exercises a veto actually firing.
#   C2 abstain_out_of_regime — gate_real_codec (calibration) + gate_real_codec_production_fit (two_mic).
#   C3 no_false_veto_truth   — gate_real_codec_production_fit (music control patches + gate
#                              no-worse-than-off) + vorbis_64k (calibration) + M5 units.
#   C4 off_no_regression     — off_no_regression_baseline (fast F1; calibration + production_fit arms).
#   C5 rescue_real_value     — resolved (synthetic-only); deadzone_finale_run_b diagnostic + deadzone_punch_assert.
# Highest-value gap: C1 production_fit pipeline veto.
