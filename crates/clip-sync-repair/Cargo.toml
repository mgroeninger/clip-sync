[package]
name = "clip-sync-repair"
version = "0.1.0"
edition = "2021"
description = "Gap scan and repair tool for clip-sync"
license = "Non-commercial"

[lib]
name = "clip_sync_repair"
path = "src/lib.rs"

[[bin]]
name = "clip-sync-repair"
path = "src/main.rs"

[features]
default = []
ffmpeg-mux = ["dep:tempfile"]

[dependencies]
clip-sync = { path = "../clip-sync" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
hound = "3"
tempfile = { version = "3", optional = true }

[dev-dependencies]
clip-sync = { path = "../clip-sync", features = ["test-utils"] }
tempfile = "3"
