[package]
name = "clip-sync-repair"
version.workspace = true
edition = "2021"
description = "Gap scan and repair tool for clip-sync"
authors = ["Matt Groeninger <1166231+mgroeninger@users.noreply.github.com>"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/mgroeninger/clip-sync"
autotests = false

[lib]
name = "clip_sync_repair"
path = "src/lib.rs"

[[bin]]
name = "clip-sync-repair"
path = "src/main.rs"

# Calibration/dev tool: diff the 250 ms scan equivalence gate against the fine-bin fingerprint reference.
[[bin]]
name = "equivalence-calibration"
path = "src/bin/equivalence_calibration.rs"

[features]
default = []
ffmpeg-mux = []
he-aac = ["clip-sync/he-aac"]
ac3 = ["clip-sync/ac3"]
ffmpeg-tests = ["clip-sync/ffmpeg-tests"]
validation-tests = []
diagnostic-tests = []

[dependencies]
clip-sync = { path = "../clip-sync" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
hound = "3"
tempfile = "3"
rustfft = "6.4"

[dev-dependencies]
clip-sync = { path = "../clip-sync", features = ["test-utils"] }
clip-sync-repair-fixtures = { path = "../clip-sync-repair-fixtures" }
clip-sync-repair-harness = { path = "../clip-sync-repair-harness" }

[[test]]
name = "anchor_seam_oracle"
path = "tests/anchor_seam_oracle.rs"

[[test]]
name = "w5_timing_offset"
path = "tests/w5_timing_offset.rs"

[[test]]
name = "config_roundtrip"
