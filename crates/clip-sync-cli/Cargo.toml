[package]
name = "clip-sync-cli"
version.workspace = true
edition = "2021"
description = "Analyzer CLI for clip-sync"
authors = ["Matt Groeninger <1166231+mgroeninger@users.noreply.github.com>"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/mgroeninger/clip-sync"

[lib]
name = "clip_sync_cli"
path = "src/lib.rs"

[[bin]]
name = "clip-sync"
path = "src/main.rs"

[features]
default = []
he-aac = ["clip-sync/he-aac"]
ac3 = ["clip-sync/ac3"]

[dependencies]
clip-sync = { path = "../clip-sync" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
clip-sync = { path = "../clip-sync", features = ["test-utils", "he-aac"] }
hound = "3"
tempfile = "3"
