# Example analyzer config (see README.md § Configuration).
# clip_length is seconds in TOML (900 = 15 minutes); CLI accepts 15m, 90s, etc.

[clip]
clip_length = 900
num_clips = 1
normalize_loudness = true
trim_silence = true

[alignment]
min_match_score = 0.3
refine_offset_with_pcm = true
refine_offset_high_rate = false
high_rate_refine_secs = 3
try_all_tracks = false

[validation]
check_clip_repetition = false
min_repetition_confidence = 0.5

[output]
format = "human"
show_diagnostics = false

[logging]
level = "warn"
